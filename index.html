    <title>2110252 Digital Logic Atlas</title>
    <script>
      // Theme bootstrap — read localStorage before paint to avoid flash.
      (function () {
        try {
          var saved = localStorage.getItem('digital-logic-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved;
          } else {
            document.documentElement.dataset.theme = 'dark';
          }
        } catch (_) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
